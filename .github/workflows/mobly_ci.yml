name: Mobly UI Automation CI

on:
  workflow_dispatch:
    inputs:
      test_target:
        description: 'Chose a test target to run. Default is all tests.'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - test_calculator_basic_arithmetic
          - test_builtin_app_exists_and_force_stop
          - test_fake_app_not_installed
          - test_system_interruption_and_locale_change
          - test_app_management
          - test_weather_network_resilience
          - test_wifi_connection

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Mobly Tests with Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
            api-level: 30
            target: google_apis_playstore
            arch: x86_64
            profile: Nexus 6
            emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -accel on
            script: |
              adb install -g "automation_mobly/tests/test_data/apks/mobly-bundled-snippets.apk"
              if [ "${{ inputs.test_target }}" = "all" ]; then bazel test //automation_mobly/tests:all --test_output=streamed --test_env=PATH --test_arg="-c" --test_arg="automation_mobly/ci_config.yaml"; else bazel test //automation_mobly/tests:${{ inputs.test_target }} --test_output=streamed --test_env=PATH --test_arg="-c" --test_arg="automation_mobly/ci_config.yaml"; fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobly-test-logs
          path: /tmp/logs/